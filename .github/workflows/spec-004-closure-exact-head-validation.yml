name: Spec 004 Closure Guarded Lifecycle Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          ref: docs/spec-004-canonical-closeout
          fetch-depth: 0

      - name: Guard exact predecessor and repair lifecycle headers
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=81c6ba52702a385c54c531c9eb7ec099b2fd39d1
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('specs/004-tournament-harness/spec.md'): (
                  '**State:** ACTIVE — bounded fixture-only implementation/reconciliation',
                  '**State:** `CLOSED_CANONICAL` — effective only after the dedicated closure-only PR is merged and resulting canonical `main` is verified',
              ),
              Path('specs/004-tournament-harness/plan.md'): (
                  '**Status:** ACTIVE — Analyze=PASS; bounded implementation/reconciliation in progress',
                  '**Status:** `CLOSED_CANONICAL` — implementation plan completed; effective lifecycle closure only after the dedicated closure-only PR is merged and resulting canonical `main` is verified',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'EXPECTED_UNIQUE_HEADER_NOT_FOUND:{path}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          changed="$(git diff --name-only | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            specs/004-tournament-harness/plan.md \
            specs/004-tournament-harness/spec.md | LC_ALL=C sort)"
          printf '%s\n' "$changed"
          test "$changed" = "$expected"
          git diff --check
          grep -Fq '**State:** `CLOSED_CANONICAL`' specs/004-tournament-harness/spec.md
          grep -Fq '**Status:** `CLOSED_CANONICAL`' specs/004-tournament-harness/plan.md
          echo 'GUARDED_HEADER_REPAIR=PASS'

      - name: Commit and fast-forward push closure branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add specs/004-tournament-harness/spec.md specs/004-tournament-harness/plan.md
          git commit -m 'docs(004): reconcile spec and plan closure state'
          git push origin HEAD:docs/spec-004-canonical-closeout
          echo "REPAIRED_HEAD=$(git rev-parse HEAD)"
