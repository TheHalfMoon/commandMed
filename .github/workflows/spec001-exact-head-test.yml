name: Spec 001 Final Candidate Builder

on:
  push:
    branches:
      - repair/spec001-fail-closed-scratch

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reviewed parent
        uses: actions/checkout@v4
        with:
          ref: fa20facab6f8ef29386809acbbf2522839174856
          fetch-depth: 0
      - name: Verify exact parent
        run: test "$(git rev-parse HEAD)" = "fa20facab6f8ef29386809acbbf2522839174856"
      - name: Fetch bounded repair script
        shell: bash
        run: |
          git fetch origin repair/spec001-coderabbit-reconcile-v2 --depth=1
          git show FETCH_HEAD:.github/spec001_repair.py > /tmp/spec001_repair.py
      - name: Apply bounded repair
        shell: bash
        run: |
          python /tmp/spec001_repair.py
          python - <<'PY'
          from pathlib import Path
          p = Path('.specify/scripts/powershell/common.ps1')
          text = p.read_text(encoding='utf-8')
          wrong = "$FeatureDirectory.Replace('\\\\', '/')"
          correct = "$FeatureDirectory.Replace('\\', '/')"
          if wrong not in text:
              raise SystemExit('expected path-normalization replacement not found')
          p.write_text(text.replace(wrong, correct, 1), encoding='utf-8')
          PY
      - name: Compile Python
        run: python -m py_compile .specify/scripts/python/*.py src/commandmed/eval_contract/*.py tests/eval_contract/*.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem .specify/scripts/powershell/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify unsupported setup-plan args fail closed
        shell: bash
        run: |
          set +e
          pwsh -NoProfile -NonInteractive -File .specify/scripts/powershell/setup-plan.ps1 --definitely-unsupported >/tmp/setup-plan-out.txt 2>/tmp/setup-plan-err.txt
          rc=$?
          set -e
          cat /tmp/setup-plan-err.txt
          test "$rc" -ne 0
      - name: Run full suite before evidence update
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee /tmp/spec001-tests.txt
      - name: Update measured closeout evidence
        run: python /tmp/spec001_repair.py --evidence-log /tmp/spec001-tests.txt
      - name: Final exact-tree validation
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          git diff --check
          echo 'CHANGED_PATHS:'
          git diff --name-only fa20facab6f8ef29386809acbbf2522839174856
          echo 'CANONICAL_HASHES:'
          python - <<'PY'
          from pathlib import Path
          from src.commandmed.eval_contract.canonical import compute_file_canonical_sha256
          for path in sorted(Path('data/eval').glob('*.json')):
              print(f'{path.name}={compute_file_canonical_sha256(path)}')
          PY
      - name: Commit candidate
        shell: bash
        run: |
          git switch -c repair/spec001-final-candidate
          git config user.name "TheHalfMoon"
          git config user.email "noreply@github.com"
          git add .specify/scripts/powershell/common.ps1 \
                  .specify/scripts/powershell/setup-plan.ps1 \
                  .specify/scripts/powershell/check-prerequisites.ps1 \
                  .specify/scripts/python/setup_plan.py \
                  .specify/scripts/python/check_prerequisites.py \
                  data/eval/benchmarks.json \
                  data/eval/gold_protocols.json \
                  src/commandmed/eval_contract/validate.py \
                  tests/eval_contract/test_fail_closed.py \
                  tests/eval_contract/test_gold_quarantine.py \
                  specs/001-eval-charter/closeout.md
          git commit -m "fix(eval): reconcile final external review findings"
          echo "FINAL_CANDIDATE_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/repair/spec001-final-candidate
