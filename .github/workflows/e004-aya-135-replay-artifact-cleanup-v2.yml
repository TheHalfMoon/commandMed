name: E004 Aya 135 replay artifact cleanup V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/e004-aya-135-replay-artifact-cleanup-v2.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AYA_ARTIFACT_ID: "9932103657"
      AYA_ARTIFACT_NAME: E004_AYA_EXACT_PAYLOAD_TRANSPORT_BRIDGE
      TOOLING_ARTIFACT_ID: "9932195460"
      TOOLING_ARTIFACT_NAME: E004_AYA_135_LOCAL_PARQUET_TOOLING_PYARROW_25_0_1_CP313
    steps:
      - name: Delete exact replay transport and tooling artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          delete_exact_artifact() {
            local artifact_id="$1"
            local expected_name="$2"
            local label="$3"
            local api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"

            metadata="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}")"

            printf '%s' "${metadata}" | jq -e \
              --argjson id "${artifact_id}" \
              --arg name "${expected_name}" \
              '.id == $id and .name == $name' >/dev/null

            http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}")"
            test "${http_code}" = "204"

            verify_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}")"
            test "${verify_code}" = "404"

            echo "${label}_DELETION_RESULT=PASS"
            echo "${label}_ARTIFACT_ID=${artifact_id}"
          }

          delete_exact_artifact "${AYA_ARTIFACT_ID}" "${AYA_ARTIFACT_NAME}" "REMOTE_AYA_REPLAY"
          delete_exact_artifact "${TOOLING_ARTIFACT_ID}" "${TOOLING_ARTIFACT_NAME}" "REMOTE_PYARROW_TOOLING"
