name: Repair Spec 007 implementation authorization evidence

on:
  push:
    branches:
      - validation/007-auth-builder

permissions:
  contents: write

jobs:
  repair-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout authorization branch
        uses: actions/checkout@v4
        with:
          ref: auth/007-implementation-start
          fetch-depth: 0

      - name: Verify reviewed head before repair
        run: |
          test "$(git rev-parse HEAD)" = "485b774c95a39b344301743b38481d8f888560f2"

      - name: Repair exact-subject evidence binding and lifecycle record
        run: |
          python3 - <<'PY'
          from pathlib import Path

          subject = '701c933acdf84572f627446e5199231236f97988'
          subject_tree = 'faa5c15c84dbd84d162b6ba6850bbc312584203b'
          run = '33040059680'
          job = '98411371329'
          carrier = '65973326632d07bb63cab03d9ab696b5f1f0c375'

          readme = Path('specs/README.md')
          text = readme.read_text(encoding='utf-8')
          old = '''SPEC_007=AUTHORIZED_TO_PLAN
MODEL_EXECUTION_AUTHORITY=NONE'''
          new = '''SPEC_007=AUTHORIZED_TO_START
MODEL_EXECUTION_AUTHORITY=NONE'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one current execution-authority lifecycle record, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old_evidence = f'''QUALIFIED_PLANNING_HEAD={subject}
P013_VALIDATION_RUN={run}
P013_COMPILEALL=PASS'''
          new_evidence = f'''QUALIFIED_PLANNING_HEAD={subject}
QUALIFIED_PLANNING_TREE={subject_tree}
P013_VALIDATED_SUBJECT_SHA={subject}
P013_VALIDATED_SUBJECT_TREE={subject_tree}
P013_VALIDATION_RUN={run}
P013_VALIDATION_JOB={job}
P013_WORKFLOW_CARRIER_SHA={carrier}
P013_WORKFLOW_CARRIER_ROLE=TRIGGER_ONLY_NOT_VALIDATED_SUBJECT
P013_EXACT_CHECKOUT_BINDING=JOB_{job}_CHECKOUT_AND_VERIFY_HEAD_BOTH_EQUAL_VALIDATED_SUBJECT_SHA
P013_COMPILEALL=PASS'''
          if text.count(old_evidence) != 1:
              raise SystemExit(f'expected one README P013 evidence block, got {text.count(old_evidence)}')
          text = text.replace(old_evidence, new_evidence, 1)

          anchor = '`E001-E015` remain blocked by their own explicit evidence/Founder/execution/data/access gates.'
          proof = f'''The P013 workflow was triggered by carrier commit `{carrier}`, but that carrier is **not** the validated subject. Job `{job}` explicitly checked out `{subject}`, verified `git rev-parse HEAD` equals that SHA, and then ran compileall, the full test suite, and the planning-base-to-subject diff check against that detached exact subject. The validated subject tree is `{subject_tree}`, identical to the canonical planning merge tree. This carrier/subject distinction is part of the canonical evidence binding and must not be inferred from the workflow-run head SHA alone.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one README authority anchor, got {text.count(anchor)}')
          text = text.replace(anchor, proof + anchor, 1)
          readme.write_text(text, encoding='utf-8')

          auth = Path('specs/007-sft-v1/implementation-authorization.md')
          a = auth.read_text(encoding='utf-8')
          old_auth = f'''QUALIFIED_PLANNING_HEAD={subject}
P013_VALIDATION_RUN={run}
P013_COMPILEALL=PASS'''
          new_auth = f'''QUALIFIED_PLANNING_HEAD={subject}
QUALIFIED_PLANNING_TREE={subject_tree}
P013_VALIDATED_SUBJECT_SHA={subject}
P013_VALIDATED_SUBJECT_TREE={subject_tree}
P013_VALIDATION_RUN={run}
P013_VALIDATION_JOB={job}
P013_WORKFLOW_CARRIER_SHA={carrier}
P013_WORKFLOW_CARRIER_ROLE=TRIGGER_ONLY_NOT_VALIDATED_SUBJECT
P013_EXACT_CHECKOUT_BINDING=JOB_{job}_CHECKOUT_AND_VERIFY_HEAD_BOTH_EQUAL_VALIDATED_SUBJECT_SHA
P013_COMPILEALL=PASS'''
          if a.count(old_auth) != 1:
              raise SystemExit(f'expected one implementation authorization P013 block, got {a.count(old_auth)}')
          a = a.replace(old_auth, new_auth, 1)
          anchor_auth = '## Founder authorization'
          proof_auth = f'''## Exact-subject validation binding\n\nGitHub Actions run `{run}` is carried by workflow-trigger commit `{carrier}` on a temporary validation branch; that carrier SHA is not the planning subject. Job `{job}` explicitly checks out `{subject}`, verifies the detached checkout equals that SHA, and executes the required checks on that exact tree `{subject_tree}`. The same tree is the canonical planning merge tree, so P013 is bound to the qualified planning content rather than to the workflow carrier.\n\n'''
          if a.count(anchor_auth) != 1:
              raise SystemExit('Founder authorization anchor mismatch')
          a = a.replace(anchor_auth, proof_auth + anchor_auth, 1)
          auth.write_text(a, encoding='utf-8')

          tasks = Path('specs/007-sft-v1/tasks.md')
          t = tasks.read_text(encoding='utf-8')
          old_task = f'- [x] **P013** Run repository baseline checks on exact planning head and record actual results. — Run `{run}`: compileall PASS; 627 tests + 128 subtests PASS; diff-check PASS.'
          new_task = f'- [x] **P013** Run repository baseline checks on exact planning head and record actual results. — Validated subject `{subject}` / tree `{subject_tree}`; run `{run}`, job `{job}` explicitly checked out and verified that subject (workflow carrier `{carrier}` is trigger-only); compileall PASS; 627 tests + 128 subtests PASS; diff-check PASS.'
          if t.count(old_task) != 1:
              raise SystemExit(f'expected one P013 task line, got {t.count(old_task)}')
          t = t.replace(old_task, new_task, 1)
          tasks.write_text(t, encoding='utf-8')
          PY

          git diff --check

      - name: Commit and push minimal repair
        run: |
          git config user.name "commandMed Governance"
          git config user.email "governance@commandmed.invalid"
          git add specs/README.md specs/007-sft-v1/tasks.md specs/007-sft-v1/implementation-authorization.md
          git diff --cached --check
          git commit -m "fix(spec007): bind authorization evidence to validated planning head"
          git push origin HEAD:auth/007-implementation-start
