name: Qualify final Spec 007 authorization candidate

on:
  push:
    branches:
      - validation/007-auth-builder

permissions:
  contents: read

jobs:
  exact-head-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4
        with:
          ref: 618c7b650463d1d8f639bdc162940542a4a94859
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Configure fixture Git identity
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"
      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "618c7b650463d1d8f639bdc162940542a4a94859"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Compile
        run: |
          python3 -m compileall -q src tests
          echo "COMPILEALL=PASS"
      - name: Full tests
        run: python3 -m pytest -q
      - name: Diff check
        run: |
          git diff --check 947f3aba4d4316e21470ac26352d96e3bfb74ae6 618c7b650463d1d8f639bdc162940542a4a94859
          echo "GIT_DIFF_CHECK=PASS"
