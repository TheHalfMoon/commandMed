name: Qualify Spec 007 implementation authorization

on:
  push:
    branches:
      - validation/007-auth-builder

permissions:
  contents: read

jobs:
  exact-head-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4
        with:
          ref: 485b774c95a39b344301743b38481d8f888560f2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Configure ephemeral Git identity for fixture plumbing
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"

      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "485b774c95a39b344301743b38481d8f888560f2"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Compile Python sources and tests
        run: |
          python3 -m compileall -q src tests
          echo "COMPILEALL=PASS"

      - name: Run full repository test suite
        run: python3 -m pytest -q

      - name: Check authorization diff whitespace
        if: always()
        run: |
          git diff --check 947f3aba4d4316e21470ac26352d96e3bfb74ae6 485b774c95a39b344301743b38481d8f888560f2
          echo "GIT_DIFF_CHECK=PASS"
