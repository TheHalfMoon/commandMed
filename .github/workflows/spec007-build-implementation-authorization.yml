name: Qualify repaired Spec 007 authorization

on:
  push:
    branches:
      - validation/007-auth-builder

permissions:
  contents: read

jobs:
  exact-head-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4
        with:
          ref: d9cdb946a76e760008031a7d20e4240c796c1f94
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Configure fixture Git identity
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"
      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "d9cdb946a76e760008031a7d20e4240c796c1f94"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Compile
        run: |
          python3 -m compileall -q src tests
          echo "COMPILEALL=PASS"
      - name: Full tests
        run: python3 -m pytest -q
      - name: Diff check
        run: |
          git diff --check 947f3aba4d4316e21470ac26352d96e3bfb74ae6 d9cdb946a76e760008031a7d20e4240c796c1f94
          echo "GIT_DIFF_CHECK=PASS"
