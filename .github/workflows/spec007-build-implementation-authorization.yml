name: Qualify fully reconciled Spec 007 authorization

on:
  push:
    branches:
      - validation/007-auth-builder

permissions:
  contents: read

jobs:
  exact-head-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact authorization head
        uses: actions/checkout@v4
        with:
          ref: 01ff5c1586804913b41599bf2f7466b0c6f323cd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Configure fixture Git identity
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"
      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "01ff5c1586804913b41599bf2f7466b0c6f323cd"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
      - name: Compile
        run: |
          python3 -m compileall -q src tests
          echo "COMPILEALL=PASS"
      - name: Full tests
        run: python3 -m pytest -q
      - name: Diff check
        run: |
          git diff --check 947f3aba4d4316e21470ac26352d96e3bfb74ae6 01ff5c1586804913b41599bf2f7466b0c6f323cd
          echo "GIT_DIFF_CHECK=PASS"
      - name: Verify no stale current lifecycle claims
        run: |
          ! grep -F '**Current lifecycle:** `AUTHORIZED_TO_PLAN`' specs/007-sft-v1/quickstart.md
          ! grep -F 'SPEC007=AUTHORIZED_TO_PLAN' specs/007-sft-v1/quickstart.md
          ! grep -F '**Lifecycle:** `AUTHORIZED_TO_PLAN`' specs/007-sft-v1/analysis.md
          ! grep -F '**Lifecycle:** `AUTHORIZED_TO_PLAN`' specs/007-sft-v1/plan.md
          ! grep -F '**Lifecycle:** `AUTHORIZED_TO_PLAN`' specs/007-sft-v1/data-model.md
          ! grep -F 'by current `AUTHORIZED_TO_PLAN`' specs/007-sft-v1/clarification.md
          ! grep -F 'CURRENT=`AUTHORIZED_TO_PLAN`' specs/007-sft-v1/spec.md
          ! grep -F 'current stage is `AUTHORIZED_TO_PLAN`' specs/007-sft-v1/spec.md
          ! grep -F '**Current lifecycle:** Spec 007 `AUTHORIZED_TO_PLAN`' docs/COMMANDMED-MEDICAL-INTELLIGENCE-DENSITY-STRATEGY-v0.1.md
          echo "STALE_CURRENT_LIFECYCLE_CLAIMS=0"
