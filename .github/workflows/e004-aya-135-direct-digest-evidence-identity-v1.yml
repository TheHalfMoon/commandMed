name: E004 Aya 135 direct-digest correction V1

on:
  pull_request:
    paths:
      - "scripts/e004_aya_135_spec003_direct_digest_v1.py"
      - "specs/007-sft-v1/e004-aya-135-deterministic-admission-projection-v1.json"
      - "specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-*.json"
      - "specs/007-sft-v1/e004-aya-135-direct-digest-correction-summary-v1.json"
      - "specs/007-sft-v1/e004-registry-current-state-reconciliation-v22-2026-09-04.md"
      - ".github/workflows/e004-aya-135-direct-digest-evidence-identity-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "HEAD_SHA=$(git rev-parse HEAD)"

      - name: Reject superseded inconsistent historical evidence files
        shell: bash
        run: |
          set -euo pipefail
          test ! -e specs/007-sft-v1/e004-aya-135-deterministic-record-evidence-result-v1.json
          test ! -e specs/007-sft-v1/e004-aya-135-spec003-post-deterministic-summary-v1.json

      - name: Verify canonical evaluator source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/commandmed/eval_contract/lineage.py)" = "5d7a5b6a8b48b2b5a7afea35ed18ceb1c9fe6425"
          test "$(git hash-object data/lineage/lineage_contract.json)" = "692de9b32271031b0f1dd9cc6edc98bc44b580b5"
          echo "SPEC003_EVALUATOR_LINEAGE_BLOB=5d7a5b6a8b48b2b5a7afea35ed18ceb1c9fe6425"
          echo "SPEC003_LINEAGE_CONTRACT_BLOB=692de9b32271031b0f1dd9cc6edc98bc44b580b5"

      - name: Verify projection and content-digest map identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum specs/007-sft-v1/e004-aya-135-deterministic-admission-projection-v1.json | awk '{print $1}')" = "1c696862705e50f10b8621f425389f8f9db0122ef8cc3027e46d50d6835430e7"
          expected=(
            b6028a65c05d41a251ef8b4a5073d30e8b4048322853a97ad020783cdea79687
            59d1445a98f6ac5bfc8d50fb125700fbbd590d61f17b7fd35e1f9d0f428923a3
            48310fdf92872e39d0c4f9527dab52e6682b9a117040f2cedef70fcf4eb63ef2
            5d58375d6a36eaa1abb5fedda95004d12381e685b09b20c129171ddadf2d4b95
            13014dcfab8fc511554c2f4fcd7afa105a84c7ccd43cf449b583627ed0fb1597
          )
          for i in 1 2 3 4 5; do
            file="specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-0${i}.json"
            actual="$(sha256sum "${file}" | awk '{print $1}')"
            test "${actual}" = "${expected[$((i-1))]}"
          done

      - name: Compile corrected direct-digest adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/e004_aya_135_spec003_direct_digest_v1.py

      - name: Execute corrected canonical Spec 003 direct-digest admission
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/e004-aya-135-spec003-direct-digest-correction-v1.json"
          summary="${RUNNER_TEMP}/summary.json"
          PYTHONPATH=. python3 scripts/e004_aya_135_spec003_direct_digest_v1.py \
            --projection specs/007-sft-v1/e004-aya-135-deterministic-admission-projection-v1.json \
            --digest-map-part specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-01.json \
            --digest-map-part specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-02.json \
            --digest-map-part specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-03.json \
            --digest-map-part specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-04.json \
            --digest-map-part specs/007-sft-v1/e004-aya-135-candidate-content-digest-map-v1-part-05.json \
            --contamination-evidence specs/007-sft-v1/e004-aya-135-qualification-evidence-v1.json \
            --contract data/lineage/lineage_contract.json \
            --out "${out}" | tee "${summary}"
          test "$(sha256sum "${out}" | awk '{print $1}')" = "a8807085864707ae88966f7a925bfd2a7fd05a0e683d70893a46d3b6d5dbdce4"
          python3 - "${summary}" <<'PY'
          import json, sys
          s=json.load(open(sys.argv[1], encoding='utf-8'))
          assert s['candidate_count'] == 135
          assert s['output_sha256'] == 'a8807085864707ae88966f7a925bfd2a7fd05a0e683d70893a46d3b6d5dbdce4'
          assert s['state_counts'] == {'BLOCKED': 92, 'ELIGIBLE': 43}
          assert s['reason_counts'] == {'PRIVACY_UNRESOLVED': 17, 'RIGHTS_UNRESOLVED': 92}
          assert s['validation_error_count'] == 0
          PY
          rm -f "${out}" "${summary}"

      - name: Verify V22 corrected result binding
        shell: bash
        run: |
          set -euo pipefail
          v22="specs/007-sft-v1/e004-registry-current-state-reconciliation-v22-2026-09-04.md"
          grep -Fxq 'SPEC003_CORRECTED_DIRECT_DIGEST_RESULTS_SHA256=a8807085864707ae88966f7a925bfd2a7fd05a0e683d70893a46d3b6d5dbdce4' "${v22}"
          grep -Fxq 'SPEC003_CANDIDATE_COUNT=135' "${v22}"
          grep -Fxq 'SPEC003_ELIGIBLE_COUNT=43' "${v22}"
          grep -Fxq 'SPEC003_BLOCKED_COUNT=92' "${v22}"
          grep -Fxq 'SPEC003_VALIDATION_ERROR_COUNT=0' "${v22}"
          grep -Fxq 'AYA_135_ELIGIBILITY_SOURCE=CANONICAL_SPEC003_EVALUATOR_DIRECT_DIGEST_ONLY' "${v22}"
          grep -Fxq 'FINAL_CURRICULUM_ADMISSION_AUTHORITY=NONE' "${v22}"
          grep -Fxq 'DATASET_SNAPSHOT_AUTHORITY=NONE' "${v22}"
          grep -Fxq 'TRAINING_AUTHORITY=NONE' "${v22}"
          grep -Fxq 'PROJECT_FINISHED=NO' "${v22}"

      - name: Verify optional canonical correction summary
        if: ${{ hashFiles('specs/007-sft-v1/e004-aya-135-direct-digest-correction-summary-v1.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p='specs/007-sft-v1/e004-aya-135-direct-digest-correction-summary-v1.json'
          s=json.load(open(p, encoding='utf-8'))
          assert s['corrected_results_sha256'] == 'a8807085864707ae88966f7a925bfd2a7fd05a0e683d70893a46d3b6d5dbdce4'
          assert s['state_counts'] == {'BLOCKED': 92, 'ELIGIBLE': 43}
          assert s['validation_error_count'] == 0
          assert s['historical_result_sha256'] == '3e7e4f15a913ca5e72c091aee4dda563f48037ed6fd67a3781fef1ade71d21ef'
          assert s['historical_evidence_byte_identity_valid'] is False
          PY

      - name: Assert no raw Aya payload exists in checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train-00000-of-00001.parquet
          test ! -e aya-train.parquet

      - name: Verify diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
