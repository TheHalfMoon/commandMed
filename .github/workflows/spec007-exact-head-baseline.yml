name: Spec 007 exact-head planning whitespace cleanup

on:
  push:
    branches:
      - validation/007-plan-e69cd916

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout planning branch
        uses: actions/checkout@v4
        with:
          ref: spec/007-plan-record-frontier
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"

      - name: Verify expected pre-cleanup head
        run: |
          test "$(git rev-parse HEAD)" = "e69cd9163f36da81d6811184138cca782ce35f7b"
          echo "PRE_CLEANUP_HEAD=$(git rev-parse HEAD)"

      - name: Remove trailing whitespace only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/COMMANDMED-MEDICAL-INTELLIGENCE-DENSITY-STRATEGY-v0.1.md'),
              Path('specs/007-sft-v1/analysis.md'),
              Path('specs/007-sft-v1/data-model.md'),
              Path('specs/007-sft-v1/plan.md'),
              Path('specs/007-sft-v1/quickstart.md'),
              Path('specs/007-sft-v1/tasks.md'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              cleaned = '\n'.join(line.rstrip() for line in text.split('\n'))
              path.write_text(cleaned, encoding='utf-8')
          PY
          git diff --check
          git diff --word-diff=porcelain -- . ':!*.json'

      - name: Commit and push whitespace-only repair
        run: |
          git add docs/COMMANDMED-MEDICAL-INTELLIGENCE-DENSITY-STRATEGY-v0.1.md \
            specs/007-sft-v1/analysis.md \
            specs/007-sft-v1/data-model.md \
            specs/007-sft-v1/plan.md \
            specs/007-sft-v1/quickstart.md \
            specs/007-sft-v1/tasks.md
          test -n "$(git diff --cached --name-only)"
          git commit -m "style(spec007): remove trailing whitespace"
          git push origin HEAD:spec/007-plan-record-frontier
