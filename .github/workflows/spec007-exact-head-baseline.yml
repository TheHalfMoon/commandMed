name: Spec 007 exact-head planning baseline

on:
  push:
    branches:
      - validation/007-plan-e69cd916

permissions:
  contents: read

jobs:
  exact-head-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact planning head
        uses: actions/checkout@v4
        with:
          ref: 701c933acdf84572f627446e5199231236f97988
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Configure ephemeral Git identity for fixture plumbing
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"

      - name: Verify exact head
        run: |
          test "$(git rev-parse HEAD)" = "701c933acdf84572f627446e5199231236f97988"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Compile Python sources and tests
        run: |
          python3 -m compileall -q src tests
          echo "COMPILEALL=PASS"

      - name: Run full repository test suite
        run: python3 -m pytest -q

      - name: Check full planning diff whitespace
        if: always()
        run: |
          git diff --check 981987390f60302d4c38ae6d54c101aa78c12f4e 701c933acdf84572f627446e5199231236f97988
          echo "GIT_DIFF_CHECK=PASS"
