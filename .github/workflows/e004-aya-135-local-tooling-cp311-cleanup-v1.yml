name: E004 Aya 135 CPython 3.11 tooling cleanup V1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/e004-aya-135-local-tooling-cp311-cleanup-v1.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARTIFACT_ID: "9899215310"
      EXPECTED_ARTIFACT_NAME: E004_AYA_135_LOCAL_PARQUET_TOOLING_PYARROW_25_0_1_CP311
    steps:
      - name: Delete exact incompatible tooling artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"

          metadata="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"

          printf '%s' "${metadata}" | jq -e \
            --argjson id "${ARTIFACT_ID}" \
            --arg name "${EXPECTED_ARTIFACT_NAME}" \
            '.id == $id and .name == $name' >/dev/null

          http_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -X DELETE \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"
          test "${http_code}" = "204"

          verify_code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}")"
          test "${verify_code}" = "404"

          echo "REMOTE_CP311_TOOLING_ARTIFACT_DELETION_RESULT=PASS"
          echo "REMOTE_CP311_TOOLING_ARTIFACT_ID=${ARTIFACT_ID}"
