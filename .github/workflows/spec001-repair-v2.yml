name: Spec 001 External Review Reconcile V2

on:
  pull_request:
    branches:
      - spec/001-eval-charter
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.head_ref == 'repair/spec001-coderabbit-reconcile-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/spec001-coderabbit-reconcile-v2
          fetch-depth: 0
      - name: Apply bounded repair
        run: python .github/spec001_repair.py
      - name: Compile Python
        run: python -m py_compile .specify/scripts/python/*.py src/commandmed/eval_contract/*.py tests/eval_contract/*.py
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem .specify/scripts/powershell/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) > $null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Verify unsupported setup-plan args fail
        shell: bash
        run: |
          set +e
          pwsh -NoProfile -NonInteractive -File .specify/scripts/powershell/setup-plan.ps1 --definitely-unsupported >/tmp/setup-plan-out.txt 2>/tmp/setup-plan-err.txt
          rc=$?
          set -e
          test "$rc" -ne 0
      - name: Run full suite
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_*.py" 2>&1 | tee /tmp/spec001-tests.txt
      - name: Update closeout evidence
        run: python .github/spec001_repair.py --evidence-log /tmp/spec001-tests.txt
      - name: Final exact-tree validation
        shell: bash
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          git diff --check
          python - <<'PY'
          from pathlib import Path
          from src.commandmed.eval_contract.canonical import compute_file_canonical_sha256
          for path in sorted(Path('data/eval').glob('*.json')):
              print(f'{path.name}={compute_file_canonical_sha256(path)}')
          PY
      - name: Commit repair on scratch branch
        shell: bash
        run: |
          git config user.name "TheHalfMoon"
          git config user.email "noreply@github.com"
          git add .specify/scripts/powershell/common.ps1 \
                  .specify/scripts/powershell/setup-plan.ps1 \
                  .specify/scripts/powershell/check-prerequisites.ps1 \
                  .specify/scripts/python/setup_plan.py \
                  .specify/scripts/python/check_prerequisites.py \
                  data/eval/benchmarks.json \
                  data/eval/gold_protocols.json \
                  src/commandmed/eval_contract/validate.py \
                  tests/eval_contract/test_fail_closed.py \
                  tests/eval_contract/test_gold_quarantine.py \
                  specs/001-eval-charter/closeout.md
          git commit -m "fix(eval): reconcile final external review findings"
          git push origin HEAD:repair/spec001-coderabbit-reconcile-v2
