name: Spec 007 implementation reconciliation qualification

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  reconciliation-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact reconciliation head
        uses: actions/checkout@v4
        with:
          ref: beb55cc2babe4d31833c2ad19d465cea75b78f9b
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Configure ephemeral Git identity for fixture plumbing
        run: |
          git config user.name "commandMed Validation"
          git config user.email "validation@commandmed.invalid"
      - name: Verify exact reconciliation head
        run: |
          test "$(git rev-parse HEAD)" = "beb55cc2babe4d31833c2ad19d465cea75b78f9b"
          echo "EXACT_RECONCILIATION_HEAD=$(git rev-parse HEAD)"
      - name: Compile Python sources and tests
        run: |
          python3 -m compileall -q src tests
          echo "COMPILEALL=PASS"
      - name: Run focused Spec 007 tests
        run: python3 -m pytest -q tests/spec007
      - name: Run full repository test suite
        run: python3 -m pytest -q
      - name: Check reconciliation diff whitespace
        run: |
          git diff --check 469a56126ed63407a4a624218b06da106470741e beb55cc2babe4d31833c2ad19d465cea75b78f9b
          echo "GIT_DIFF_CHECK=PASS"
      - name: Enforce docs-only reconciliation scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 469a56126ed63407a4a624218b06da106470741e beb55cc2babe4d31833c2ad19d465cea75b78f9b | while IFS= read -r path; do
            case "$path" in
              specs/007-sft-v1/tasks.md|specs/007-sft-v1/implementation-reconciliation.md) ;;
              *) echo "OUT_OF_SCOPE_PATH=$path"; exit 1 ;;
            esac
          done
          echo "DOCS_ONLY_RECONCILIATION_SCOPE=PASS"
