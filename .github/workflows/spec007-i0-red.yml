name: Spec 007 I5 exact-head RED

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: c455287fe862a012012c1fcb6ff5da90c571268f
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact RED subject
        run: |
          test "$(git rev-parse HEAD)" = "c455287fe862a012012c1fcb6ff5da90c571268f"
          echo "RED_SUBJECT_SHA=$(git rev-parse HEAD)"
      - name: Run focused I027-I031 RED tests
        run: python3 -m pytest -q tests/spec007/test_intelligence_failure_contracts.py
