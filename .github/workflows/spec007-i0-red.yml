name: Spec 007 review-repair RED

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  review-repair-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact review-repair RED head
        uses: actions/checkout@v4
        with:
          ref: 2e0f5cf485d9c5ca5f8b91c582d1087d50c20b60
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact RED head
        run: |
          test "$(git rev-parse HEAD)" = "2e0f5cf485d9c5ca5f8b91c582d1087d50c20b60"
          echo "EXACT_RED_HEAD=$(git rev-parse HEAD)"
      - name: Compile regression fixture
        run: python3 -m compileall -q src tests/spec007/test_review_repair_regressions.py
      - name: Run review-repair regression fixture
        run: python3 -m pytest -q tests/spec007/test_review_repair_regressions.py
