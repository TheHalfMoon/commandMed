name: Spec 007 CodeRabbit repair RED

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  coderabbit-repair-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact CodeRabbit RED head
        uses: actions/checkout@v4
        with:
          ref: 4c5aa33235622a0eae8825942652d11bad5e36ad
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact RED head
        run: |
          test "$(git rev-parse HEAD)" = "4c5aa33235622a0eae8825942652d11bad5e36ad"
          echo "EXACT_RED_HEAD=$(git rev-parse HEAD)"
      - name: Compile review regression fixture
        run: python3 -m compileall -q src tests/spec007/test_review_repair_regressions.py
      - name: Run remaining CodeRabbit regressions
        run: python3 -m pytest -q tests/spec007/test_review_repair_regressions.py
