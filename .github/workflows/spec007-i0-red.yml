name: Spec 007 I6 exact-head RED

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: 2e9e3a6df0b4a73979260a9f70fa979491991406
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact RED subject
        run: |
          test "$(git rev-parse HEAD)" = "2e9e3a6df0b4a73979260a9f70fa979491991406"
          echo "RED_SUBJECT_SHA=$(git rev-parse HEAD)"
      - name: Run focused I032-I038 RED tests
        run: python3 -m pytest -q tests/spec007/test_activation_control_plane.py
