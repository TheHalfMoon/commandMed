name: Spec 007 I1 exact-head RED

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: 2fd7d7c73761fc8d527d57d9f0b6f97374b66491
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify exact RED subject
        run: |
          test "$(git rev-parse HEAD)" = "2fd7d7c73761fc8d527d57d9f0b6f97374b66491"
          echo "RED_SUBJECT_SHA=$(git rev-parse HEAD)"

      - name: Run focused I005-I010 tests
        run: python3 -m pytest -q tests/spec007/test_curriculum.py tests/spec007/test_quarantine_snapshot.py
