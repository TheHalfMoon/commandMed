name: Spec 007 I0 exact-head GREEN

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  focused-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact GREEN head
        uses: actions/checkout@v4
        with:
          ref: a3ff3ce90d47c8615dd0047f80c0eb3ce61cb373
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify exact GREEN subject
        run: |
          test "$(git rev-parse HEAD)" = "a3ff3ce90d47c8615dd0047f80c0eb3ce61cb373"
          echo "GREEN_SUBJECT_SHA=$(git rev-parse HEAD)"

      - name: Compile Spec 007 foundation
        run: python3 -m compileall -q src/commandmed/spec007 tests/spec007

      - name: Run focused Spec 007 foundation tests
        run: python3 -m pytest -q tests/spec007
