name: Spec 007 I4 exact-head RED

on:
  push:
    branches:
      - validation/007-impl-red-afc1ee07

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: 5b2d7189a2792488263ed2bd730a7f57d87efcd8
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest only
        run: python -m pip install --disable-pip-version-check pytest
      - name: Verify exact RED subject
        run: |
          test "$(git rev-parse HEAD)" = "5b2d7189a2792488263ed2bd730a7f57d87efcd8"
          echo "RED_SUBJECT_SHA=$(git rev-parse HEAD)"
      - name: Run focused I021-I026 RED tests
        run: python3 -m pytest -q tests/spec007/test_selection_reproducibility.py
