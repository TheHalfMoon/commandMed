# E004 SP007-RO-001 SUCCESSOR SUBJECT-METADATA EVIDENCE V1.
#
# Review-first metadata-only evidence lane. Pull requests execute static
# qualification only. Exactly one later marker push may collect evidence after
# canonical merge under the bounded authorization record.
#
# The push job may open only the two exact E002-allowlisted GGUF artifacts for
# static container metadata parsing and may download only enumerated non-weight
# config/tokenizer files from the four frozen source revisions. Model runtime
# load, inference, tensor-payload parsing, conversion, tournament execution,
# A15 activation, training, credentials, artifact upload, and spend are barred.

name: E004 successor subject metadata evidence V1

on:
  pull_request:
    paths:
      - .github/workflows/e004-successor-subject-metadata-evidence-v1.yml
      - specs/007-sft-v1/e004-successor-subject-metadata-evidence-authorization-2026-09-06.md
      - specs/007-sft-v1/e004-registry-current-state-reconciliation-v34-2026-09-06.md
  push:
    branches:
      - evidence/e004-successor-subject-metadata-run-v1
    paths:
      - .github/e004-successor-subject-metadata-run-v1.txt

permissions: {}

concurrency:
  group: e004-successor-subject-metadata-evidence-v1-${{ github.event_name }}
  cancel-in-progress: false

env:
  AUTHORITY_RECORD: specs/007-sft-v1/e004-successor-subject-metadata-evidence-authorization-2026-09-06.md
  QWEN06_GGUF_REPO: Antigma/Qwen3-0.6B-Base-GGUF
  QWEN06_GGUF_REV: f457544766bcdc72afd3514439eb3d422d4434dc
  QWEN06_GGUF_FILE: qwen3-0.6b-base-q4_k_m.gguf
  QWEN06_GGUF_BYTES: "396704512"
  QWEN06_GGUF_SHA256: 218d3f063193b40008d4e63d90cf83e7dc6d33a8c6c1c647589f868a8fc74492
  QWEN35_GGUF_REPO: ggml-org/Qwen3.5-0.8B-Base-GGUF
  QWEN35_GGUF_REV: 1bd44f68963429437d08bc12f465716eb31ba6e5
  QWEN35_GGUF_FILE: Qwen3.5-0.8B-Base-Q4_0.gguf
  QWEN35_GGUF_BYTES: "563035840"
  QWEN35_GGUF_SHA256: 0dabf7f08793293d999ea306cee8c9caa3d76099e791ea2b0ce8f555f4e4098d
  QWEN06_SOURCE_REPO: Qwen/Qwen3-0.6B-Base
  QWEN06_SOURCE_REV: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
  QWEN35_SOURCE_REPO: Qwen/Qwen3.5-0.8B-Base
  QWEN35_SOURCE_REV: dc7cdfe2ee4154fa7e30f5b51ca41bfa40174e68
  GRANITE_SOURCE_REPO: ibm-granite/granite-4.0-350m-base
  GRANITE_SOURCE_REV: a50b46cef21c8a86b15f0496cb794487a78a910b
  CONTROL_SOURCE_REPO: Qwen/Qwen3-4B-Base
  CONTROL_SOURCE_REV: 906bfd4b4dc7f14ee4320094d8b41684abff8539
  GIT_TERMINAL_PROMPT: "0"
  PYTHONHASHSEED: "0"

jobs:
  static-qualification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact head and bounded authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test -f "$AUTHORITY_RECORD"
          grep -Fxq 'E004_SUCCESSOR_SUBJECT_METADATA_EVIDENCE_AUTHORITY=AUTHORIZED_BOUNDED' "$AUTHORITY_RECORD"
          grep -Fxq 'MAX_AUTHORIZED_SUBJECT_METADATA_EVIDENCE_RUNS=1' "$AUTHORITY_RECORD"
          grep -Fxq 'RERUN_AUTHORITY=NONE_BY_DEFAULT' "$AUTHORITY_RECORD"
          grep -Fxq 'MODEL_RUNTIME_LOAD=PROHIBITED' "$AUTHORITY_RECORD"
          grep -Fxq 'MODEL_INFERENCE=PROHIBITED' "$AUTHORITY_RECORD"
          grep -Fxq 'TENSOR_PAYLOAD_READ_BY_GGUF_PARSER=PROHIBITED' "$AUTHORITY_RECORD"
          grep -Fxq 'A15_ACTIVATION=PROHIBITED' "$AUTHORITY_RECORD"
          grep -Fxq 'CREDENTIAL_USE=PROHIBITED' "$AUTHORITY_RECORD"
          grep -Fxq 'SPEND_USD=0' "$AUTHORITY_RECORD"

      - name: Prove evidence job is inert on pull requests
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow='.github/workflows/e004-successor-subject-metadata-evidence-v1.yml'
          predicate="if: github.event_name == 'push' && github.ref == 'refs/heads/evidence/e004-successor-subject-metadata-run-v1'"
          test "$(grep -Fc "$predicate" "$workflow")" = '1'
          prefix='actions/'
          if grep -Eq "${prefix}(upload-artifact|cache)@" "$workflow"; then
            echo 'Artifact/cache action is prohibited' >&2
            exit 1
          fi
          loader='from_'"pretrained"
          if grep -Fq "$loader" "$workflow"; then
            echo 'Model-loading API is prohibited' >&2
            exit 1
          fi
          remote_code='trust_'"remote_code"
          if grep -Fq "$remote_code" "$workflow"; then
            echo 'Remote-code execution surface is prohibited' >&2
            exit 1
          fi
          git diff --check "${{ github.event.pull_request.base.sha }}"...HEAD

  subject-metadata-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/evidence/e004-successor-subject-metadata-run-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout canonical evidence head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed metadata-only preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$AUTHORITY_RECORD"
          grep -Fxq 'E004_SUCCESSOR_SUBJECT_METADATA_EVIDENCE_AUTHORITY=AUTHORIZED_BOUNDED' "$AUTHORITY_RECORD"
          grep -Fxq 'MAX_AUTHORIZED_SUBJECT_METADATA_EVIDENCE_RUNS=1' "$AUTHORITY_RECORD"
          unset HF_TOKEN HUGGING_FACE_HUB_TOKEN GH_TOKEN GITHUB_TOKEN
          for name in HF_TOKEN HUGGING_FACE_HUB_TOKEN GH_TOKEN GITHUB_TOKEN; do test -z "${!name:-}"; done
          required_tools=(bash curl python3 sha256sum stat sort awk grep df tee wc)
          for tool in "${required_tools[@]}"; do command -v "$tool" >/dev/null; done
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          test "$available_kb" -ge 3145728
          printf '%s\n' \
            'AUTHORITY=E004_SUCCESSOR_SUBJECT_METADATA_EVIDENCE_AUTHORITY_AUTHORIZED_BOUNDED' \
            'GGUF_STATIC_METADATA_OPEN=AUTHORIZED_E002_EXACT_ALLOWLIST_ONLY' \
            'MODEL_RUNTIME_LOAD=PROHIBITED' 'MODEL_EXECUTION=PROHIBITED' \
            'TOURNAMENT_EXECUTION=PROHIBITED' 'A15_ACTIVATION=PROHIBITED' \
            'CONVERSION=PROHIBITED' 'TRAINING=PROHIBITED' \
            'CREDENTIAL_USE=PROHIBITED' 'ARTIFACT_UPLOAD=PROHIBITED' \
            'PAID_OR_LARGER_RUNNER=PROHIBITED' 'SPEND_USD=0' \
            "AVAILABLE_KB=$available_kb" "RUN_ID=${GITHUB_RUN_ID:-UNSET}" \
            "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT:-UNSET}" "RUN_HEAD_SHA=${GITHUB_SHA:-UNSET}" \
            "RUNNER_OS=${RUNNER_OS:-UNSET}" "RUNNER_ARCH=${RUNNER_ARCH:-UNSET}" \
            "ImageOS=${ImageOS:-UNSET}" "ImageVersion=${ImageVersion:-UNSET}"

      - name: Build deterministic GGUF metadata-only parser
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/e004-subject-metadata
        run: |
          set -Eeuo pipefail
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          cat > "$ROOT/gguf_meta.py" <<'PY'
          import hashlib
          import json
          import struct
          import sys

          SCALAR = {
              0: ('<B', 1), 1: ('<b', 1), 2: ('<H', 2), 3: ('<h', 2),
              4: ('<I', 4), 5: ('<i', 4), 6: ('<f', 4), 7: ('<?', 1),
              10: ('<Q', 8), 11: ('<q', 8), 12: ('<d', 8),
          }
          CAPTURE = {'general.architecture', 'general.name', 'tokenizer.ggml.model', 'tokenizer.ggml.pre', 'tokenizer.chat_template'}

          class Reader:
              def __init__(self, fp):
                  self.fp = fp
                  self.h = hashlib.sha256()
                  self.count = 0
              def read(self, n):
                  b = self.fp.read(n)
                  if len(b) != n:
                      raise SystemExit(f'unexpected EOF after {self.count} bytes')
                  self.h.update(b)
                  self.count += n
                  return b
              def unpack(self, fmt):
                  return struct.unpack(fmt, self.read(struct.calcsize(fmt)))[0]
              def string(self):
                  n = self.unpack('<Q')
                  if n > 100_000_000:
                      raise SystemExit('unreasonable GGUF string length')
                  return self.read(n).decode('utf-8')

          def value(r, typ, capture=False):
              if typ in SCALAR:
                  fmt, _ = SCALAR[typ]
                  v = r.unpack(fmt)
                  return v if capture else None
              if typ == 8:
                  s = r.string()
                  return s if capture else None
              if typ == 9:
                  elem = r.unpack('<I')
                  n = r.unpack('<Q')
                  if n > 10_000_000:
                      raise SystemExit('unreasonable GGUF array length')
                  out = [] if capture and n <= 1024 else None
                  for _ in range(n):
                      item = value(r, elem, capture=out is not None)
                      if out is not None:
                          out.append(item)
                  return out
              raise SystemExit(f'unsupported GGUF value type {typ}')

          path, expected_arch = sys.argv[1], sys.argv[2]
          with open(path, 'rb', buffering=1024 * 1024) as fp:
              r = Reader(fp)
              if r.read(4) != b'GGUF':
                  raise SystemExit('invalid GGUF magic')
              version = r.unpack('<I')
              tensor_count = r.unpack('<Q')
              kv_count = r.unpack('<Q')
              selected = {}
              tokenizer_keys = 0
              for _ in range(kv_count):
                  key = r.string()
                  typ = r.unpack('<I')
                  if key.startswith('tokenizer.'):
                      tokenizer_keys += 1
                  captured = value(r, typ, capture=key in CAPTURE)
                  if key in CAPTURE:
                      selected[key] = captured
              for _ in range(tensor_count):
                  r.string()
                  n_dims = r.unpack('<I')
                  if n_dims > 16:
                      raise SystemExit('unreasonable GGUF tensor rank')
                  for _ in range(n_dims):
                      r.unpack('<Q')
                  r.unpack('<I')
                  r.unpack('<Q')
              if selected.get('general.architecture') != expected_arch:
                  raise SystemExit(f"architecture mismatch: {selected.get('general.architecture')!r} != {expected_arch!r}")
              if tokenizer_keys == 0:
                  raise SystemExit('no tokenizer metadata keys observed')
              evidence = {
                  'gguf_version': version,
                  'tensor_count': tensor_count,
                  'metadata_kv_count': kv_count,
                  'tokenizer_metadata_key_count': tokenizer_keys,
                  'selected_metadata': selected,
                  'metadata_and_tensor_directory_bytes_read': r.count,
                  'metadata_and_tensor_directory_sha256': r.h.hexdigest(),
                  'tensor_payload_bytes_read': 0,
              }
              print(json.dumps(evidence, sort_keys=True, separators=(',', ':'), ensure_ascii=False))
          PY
          python3 -m py_compile "$ROOT/gguf_meta.py"
          sha256sum "$ROOT/gguf_meta.py"

      - name: Inspect exact E002 GGUF artifacts without model load
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/e004-subject-metadata
        run: |
          set -Eeuo pipefail
          unset HF_TOKEN HUGGING_FACE_HUB_TOKEN GH_TOKEN GITHUB_TOKEN
          inspect_one() {
            local label="$1" repo="$2" rev="$3" file="$4" expected_bytes="$5" expected_sha="$6" expected_arch="$7"
            local path="$ROOT/$file"
            local url="https://huggingface.co/${repo}/resolve/${rev}/${file}?download=true"
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 30 --output "$path.part" "$url"
            local actual_bytes actual_sha
            actual_bytes="$(stat -c '%s' "$path.part")"
            actual_sha="$(sha256sum "$path.part" | awk '{print $1}')"
            test "$actual_bytes" = "$expected_bytes"
            test "$actual_sha" = "$expected_sha"
            mv "$path.part" "$path"
            printf '%s\n' "${label}_GGUF_BYTES=$actual_bytes" "${label}_GGUF_SHA256=$actual_sha"
            python3 "$ROOT/gguf_meta.py" "$path" "$expected_arch" | tee "$ROOT/${label}.json"
            printf '%s\n' "${label}_GGUF_METADATA_EVIDENCE_SHA256=$(sha256sum "$ROOT/${label}.json" | awk '{print $1}')"
            rm -f "$path"
          }
          inspect_one QWEN06 "$QWEN06_GGUF_REPO" "$QWEN06_GGUF_REV" "$QWEN06_GGUF_FILE" "$QWEN06_GGUF_BYTES" "$QWEN06_GGUF_SHA256" qwen3
          inspect_one QWEN35 "$QWEN35_GGUF_REPO" "$QWEN35_GGUF_REV" "$QWEN35_GGUF_FILE" "$QWEN35_GGUF_BYTES" "$QWEN35_GGUF_SHA256" qwen35
          printf '%s\n' \
            'GGUF_MODEL_ARTIFACTS_OPENED_FOR_STATIC_METADATA_ONLY=YES' \
            'GGUF_TENSOR_PAYLOAD_BYTES_READ=0' \
            'MODEL_RUNTIME_LOAD_PERFORMED=NO' \
            'MODEL_EXECUTION_PERFORMED=NO'

      - name: Bind exact frozen source config and tokenizer identities
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/e004-subject-metadata
        run: |
          set -Eeuo pipefail
          unset HF_TOKEN HUGGING_FACE_HUB_TOKEN GH_TOKEN GITHUB_TOKEN
          manifest="$ROOT/source-metadata.tsv"
          : > "$manifest"
          fetch_one() {
            local label="$1" repo="$2" rev="$3" file="$4" expected_sha="${5:-}"
            local dir="$ROOT/source/$label"
            mkdir -p "$dir"
            local path="$dir/$file"
            local url="https://huggingface.co/${repo}/resolve/${rev}/${file}?download=true"
            curl --fail --location --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 --connect-timeout 30 --output "$path.part" "$url"
            local bytes sha
            bytes="$(stat -c '%s' "$path.part")"
            sha="$(sha256sum "$path.part" | awk '{print $1}')"
            if [ -n "$expected_sha" ]; then test "$sha" = "$expected_sha"; fi
            mv "$path.part" "$path"
            printf '%s\t%s\t%s\t%s\n' "$label" "$file" "$bytes" "$sha" | tee -a "$manifest"
          }

          for file in config.json merges.txt tokenizer.json tokenizer_config.json vocab.json; do
            fetch_one QWEN06 "$QWEN06_SOURCE_REPO" "$QWEN06_SOURCE_REV" "$file"
            fetch_one QWEN35 "$QWEN35_SOURCE_REPO" "$QWEN35_SOURCE_REV" "$file"
          done

          fetch_one GRANITE "$GRANITE_SOURCE_REPO" "$GRANITE_SOURCE_REV" config.json 089690e22b9eafadcdd385afa5b6f3ea2446674ff5398c71df23be059d7c795d
          fetch_one GRANITE "$GRANITE_SOURCE_REPO" "$GRANITE_SOURCE_REV" merges.txt b6fe424e334903f7fb84d3a106d9730455f4744b9fe3c21ee136d97a00e72502
          fetch_one GRANITE "$GRANITE_SOURCE_REPO" "$GRANITE_SOURCE_REV" special_tokens_map.json c08676c49fd7969a3130f72be6d4bf34da66aa484a6e21dffe359893a1bd5f2e
          fetch_one GRANITE "$GRANITE_SOURCE_REPO" "$GRANITE_SOURCE_REV" tokenizer.json e2bad66439538cb4d5a7580680932432ed9ece9d3b8577e675512bdf11599253
          fetch_one GRANITE "$GRANITE_SOURCE_REPO" "$GRANITE_SOURCE_REV" tokenizer_config.json a5ec5daab12ba090a90f3dd169c8f9c275557013a87b9c1258dc7cb497a35c86
          fetch_one GRANITE "$GRANITE_SOURCE_REPO" "$GRANITE_SOURCE_REV" vocab.json 8af71076de8b0b626eed0f4c984faf0a7c062479164b2a31308a948524d4f69c

          fetch_one CONTROL "$CONTROL_SOURCE_REPO" "$CONTROL_SOURCE_REV" config.json 304b2545a258d35620f1d4bf46940c0471d9baa00715ff8e77f84c2fca5057c1
          fetch_one CONTROL "$CONTROL_SOURCE_REPO" "$CONTROL_SOURCE_REV" merges.txt 8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5
          fetch_one CONTROL "$CONTROL_SOURCE_REPO" "$CONTROL_SOURCE_REV" tokenizer.json c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539
          fetch_one CONTROL "$CONTROL_SOURCE_REPO" "$CONTROL_SOURCE_REV" tokenizer_config.json 3c04ed3ca964ea2f6b2b5faf0dc4d31aec1cb1e8b4bcf63f402d295046b422b5
          fetch_one CONTROL "$CONTROL_SOURCE_REPO" "$CONTROL_SOURCE_REV" vocab.json ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910

          sort -o "$manifest" "$manifest"
          cat "$manifest"
          printf '%s\n' \
            "SOURCE_METADATA_FILE_COUNT=$(wc -l < "$manifest" | tr -d ' ')" \
            "SOURCE_METADATA_MANIFEST_SHA256=$(sha256sum "$manifest" | awk '{print $1}')" \
            'GRANITE_PRIOR_CANONICAL_NONWEIGHT_HASH_SET=PASS_MATCHED' \
            'CONTROL_PRIOR_CANONICAL_NONWEIGHT_HASH_SET=PASS_MATCHED' \
            'SOURCE_SAFETENSORS_WEIGHT_FILES_DOWNLOADED=NO' \
            'MODEL_RUNTIME_LOAD_PERFORMED=NO' \
            'MODEL_EXECUTION_PERFORMED=NO' \
            'CREDENTIAL_USE_PERFORMED=NO' \
            'ARTIFACT_UPLOAD_PERFORMED=NO' \
            'SPEND_USD=0'
