name: Spec 002 Final Exact-Head Validation 30a8

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Spec 002 candidate
        uses: actions/checkout@v4
        with:
          ref: 30a89e0d8c2a5db3488113e360da25e3585bd1bd
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove exact identity and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "30a89e0d8c2a5db3488113e360da25e3585bd1bd"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          python --version
          python -m compileall -q src tests
          echo "PYTHON_SYNTAX=PASS"

      - name: Validate safety policy and semantic identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from src.commandmed.eval_contract.canonical import compute_file_canonical_sha256
          from src.commandmed.eval_contract.safety import validate_safety_policy

          policy = json.loads(Path('data/eval/safety_policy.json').read_text(encoding='utf-8'))
          errors = validate_safety_policy(policy)
          if errors:
              raise SystemExit('SAFETY_POLICY_VALIDATION=FAIL\n' + '\n'.join(errors))
          print('SAFETY_POLICY_VALIDATION=PASS')

          expected = {
              'data/eval/benchmarks.json': '7f58edba1ac179cbf24cb2d5c902e2ef947024bfd1c6eacdbef1a609b00f64a7',
              'data/eval/gold_protocols.json': '40c89702469d759f4dc893aff6bc6fdb7e300f9cb2d8f19f2b3e0dbd78200666',
              'data/eval/metrics.json': '304c980ce4ce84c18f70115661089db29430d0166a630cd9e95948726d24143a',
              'data/eval/quarantine.json': 'b59fd86a7f63c8de7058a0386f57de1cadc7c817edfa1e9e0aa392ca5219e080',
              'data/eval/safety_policy.json': '79a12414fe68fc08efb43070f3eede36976f2e0dc0ece7f4eed4bbcc5496d14f',
          }
          for path, wanted in expected.items():
              got = compute_file_canonical_sha256(path)
              print(f'{path}={got}')
              if got != wanted:
                  raise SystemExit(f'SEMANTIC_IDENTITY_DRIFT={path}: expected {wanted}, got {got}')
          print('SEMANTIC_IDENTITIES=PASS')
          PY

      - name: Run focused Spec 002 tests
        run: python -m unittest tests.eval_contract.test_safety_policy

      - name: Run hard-gate integration tests
        run: python -m unittest tests.eval_contract.test_hard_gates

      - name: Run full offline suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Diff hygiene and bounded paths
        shell: bash
        run: |
          set -euo pipefail
          BASE=cc02b0d99d67e5a720502953c99307c8b991720d
          git diff --check "${BASE}...HEAD"
          echo "GIT_DIFF_CHECK=PASS"
          echo "CHANGED_PATHS_BEGIN"
          git diff --name-only "${BASE}...HEAD"
          echo "CHANGED_PATHS_END"
          if git diff --name-only "${BASE}...HEAD" | grep -Eq '(^|/)(models?|weights?|checkpoints?)(/|$)|(^|/)secrets?(/|$)|(^|/)credentials?(/|$)'; then
            echo "PROHIBITED_PATH_PATTERN=FAIL"
            exit 1
          fi
          echo "BOUNDED_PATH_PREFLIGHT=PASS"
