name: E004 Aya 43 curriculum construction V1

on:
  pull_request:
    paths:
      - "scripts/e004_aya_43_curriculum_construction_v1.py"
      - "tests/spec007/test_e004_aya_43_curriculum_construction.py"
      - "specs/007-sft-v1/e004-aya-43-curriculum-construction-method-v1-2026-09-04.md"
      - "specs/007-sft-v1/e004-aya-43-curriculum-and-scope-persistence-v1-header.json"
      - "specs/007-sft-v1/e004-aya-43-curriculum-and-scope-persistence-v1-part-01.json"
      - "specs/007-sft-v1/e004-aya-43-curriculum-and-scope-persistence-v1-part-02.json"
      - "specs/007-sft-v1/e004-aya-43-curriculum-and-scope-persistence-v1-packed-parts-03-09.json.gz.b64"
      - "specs/007-sft-v1/e004-aya-43-curriculum-construction-evidence-v1-2026-09-04.md"
      - "specs/007-sft-v1/e004-registry-current-state-reconciliation-v23-2026-09-04.md"
      - ".github/workflows/e004-aya-43-curriculum-construction-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "HEAD_SHA=$(git rev-parse HEAD)"

      - name: Verify canonical Founder authority and method boundary
        shell: bash
        run: |
          set -euo pipefail
          decision="specs/007-sft-v1/e004-final-curriculum-admission-founder-decision-2026-09-04.md"
          method="specs/007-sft-v1/e004-aya-43-curriculum-construction-method-v1-2026-09-04.md"
          grep -Fxq 'FOUNDER_FINAL_CURRICULUM_ADMISSION_DECISION=E004_FINAL_CURRICULUM_ADMISSION_DECISION_B' "${decision}"
          grep -Fxq 'FINAL_CURRICULUM_RECORD_COUNT=43' "${decision}"
          grep -Fxq 'FINAL_CURRICULUM_RECORD_ID_SET_SHA256=417a1b6afbedf1aa72a31e9f06478526fe0f73f0d3bd3338b2d633b23eda8ee4' "${decision}"
          grep -Fxq 'CURRICULUM_RECORD_CONSTRUCTION_AUTHORITY=AUTHORIZED_EXACT_AYA_43_HASH_BOUND_METADATA_ONLY' "${decision}"
          grep -Fxq 'CONTENT_SCOPE_VERIFICATION_AUTHORITY=AUTHORIZED_EXACT_AYA_43_ONLY' "${decision}"
          grep -Fxq 'DATASET_SNAPSHOT_AUTHORITY=NONE' "${decision}"
          grep -Fq '**Method ID:** `AYA_43_HASH_BOUND_CURRICULUM_CONSTRUCTION_V1`' "${method}"
          grep -Fq '**DatasetSnapshot authority:** NONE' "${method}"
          grep -Fq '**Training authority:** NONE' "${method}"

      - name: Compile implementation and focused test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q \
            scripts/e004_aya_43_curriculum_construction_v1.py \
            tests/spec007/test_e004_aya_43_curriculum_construction.py

      - name: Run focused synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python3 -m unittest -v \
            tests.spec007.test_e004_aya_43_curriculum_construction

      - name: Reconstruct and validate exact persisted Aya-43 bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path("specs/007-sft-v1")
          header_path = root / "e004-aya-43-curriculum-and-scope-persistence-v1-header.json"
          part1_path = root / "e004-aya-43-curriculum-and-scope-persistence-v1-part-01.json"
          part2_path = root / "e004-aya-43-curriculum-and-scope-persistence-v1-part-02.json"
          packed_path = root / "e004-aya-43-curriculum-and-scope-persistence-v1-packed-parts-03-09.json.gz.b64"

          expected_file_sha256 = {
              header_path: "896d502cd9e18f207d1219da2c63daaaabf04904b5302c9ae217df4d056057a4",
              part1_path: "e570ec057b474f5df7ed6f8cac5c1b4e1b508a095536b24cde25b30840445ca6",
              part2_path: "69d046bd3fc5c75b510b51ac6ba6d1e163a9b77f04a5a132c7a86a8ed963dc0f",
          }
          for path, expected in expected_file_sha256.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != expected:
                  raise SystemExit(f"PERSISTENCE_FILE_SHA256_MISMATCH:{path.name}:{actual}")

          header = json.loads(header_path.read_text(encoding="utf-8"))
          if header != {
              **header,
              "artifact_id": "e004-aya-43-curriculum-and-scope-persistence-v1",
              "schema_version": "1",
              "entry_count": 43,
              "part_count": 9,
              "expected_full_bundle_sha256": "f12f70a754e39d395c4d5999fcae1d6718640b1a97931fd9f48321469b87be03",
          }:
              raise SystemExit("PERSISTENCE_HEADER_IDENTITY_MISMATCH")

          packed_b64 = packed_path.read_bytes().strip()
          packed_gzip = base64.b64decode(packed_b64, validate=True)
          if hashlib.sha256(packed_gzip).hexdigest() != "928c69fecd957477ac931cd9464184e1f9455bd359f30258112158a6f8308139":
              raise SystemExit("PACKED_GZIP_SHA256_MISMATCH")
          packed_raw = gzip.decompress(packed_gzip)
          if hashlib.sha256(packed_raw).hexdigest() != "ac0001440b55dd5469fe57ccbc367b530fc175bbaf7aceb3c1c5d11786eff5f5":
              raise SystemExit("PACKED_RAW_SHA256_MISMATCH")
          packed = json.loads(packed_raw)
          if packed.get("artifact_id") != "e004-aya-43-curriculum-and-scope-persistence-packed-parts-v1":
              raise SystemExit("PACKED_ARTIFACT_ID_MISMATCH")
          if packed.get("schema_version") != "1" or packed.get("first_part") != 3 or packed.get("last_part") != 9:
              raise SystemExit("PACKED_RANGE_MISMATCH")

          parts = [
              json.loads(part1_path.read_text(encoding="utf-8")),
              json.loads(part2_path.read_text(encoding="utf-8")),
              *packed.get("parts", []),
          ]
          if len(parts) != 9:
              raise SystemExit("PERSISTENCE_PART_COUNT_MISMATCH")

          entries = []
          for expected_part, part in enumerate(parts, start=1):
              if part.get("artifact_id") != "e004-aya-43-curriculum-and-scope-persistence-part-v1":
                  raise SystemExit(f"PART_ARTIFACT_ID_MISMATCH:{expected_part}")
              if part.get("schema_version") != "1" or part.get("part") != expected_part or part.get("part_count") != 9:
                  raise SystemExit(f"PART_IDENTITY_MISMATCH:{expected_part}")
              part_entries = part.get("entries")
              if not isinstance(part_entries, list) or not part_entries:
                  raise SystemExit(f"PART_ENTRIES_INVALID:{expected_part}")
              entries.extend(part_entries)

          if len(entries) != 43:
              raise SystemExit("PERSISTED_ENTRY_COUNT_MISMATCH")

          bundle = dict(header["bundle_fields"])
          bundle["entries"] = entries
          if bundle.get("eligible_record_count") != 43:
              raise SystemExit("BUNDLE_ELIGIBLE_COUNT_MISMATCH")
          if bundle.get("eligible_record_id_set_sha256") != "417a1b6afbedf1aa72a31e9f06478526fe0f73f0d3bd3338b2d633b23eda8ee4":
              raise SystemExit("BUNDLE_ELIGIBLE_SET_MISMATCH")
          if bundle.get("raw_aya_text_persisted") is not False or bundle.get("user_id_read") is not False:
              raise SystemExit("BUNDLE_PRIVACY_BOUNDARY_MISMATCH")
          if bundle.get("remote_model_or_ai_record_processing") is not False:
              raise SystemExit("BUNDLE_EXTERNAL_PROCESSING_BOUNDARY_MISMATCH")

          prohibited_keys = {"inputs", "targets", "prompt", "prompt_text", "user_id"}
          def assert_safe(value):
              if isinstance(value, dict):
                  for key, child in value.items():
                      if key in prohibited_keys:
                          raise SystemExit(f"PROHIBITED_PERSISTED_KEY:{key}")
                      assert_safe(child)
              elif isinstance(value, list):
                  for child in value:
                      assert_safe(child)
          assert_safe(bundle)

          bundle_bytes = json.dumps(
              bundle,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ).encode("utf-8") + b"\n"
          actual_bundle_sha256 = hashlib.sha256(bundle_bytes).hexdigest()
          expected_bundle_sha256 = header["expected_full_bundle_sha256"]
          if actual_bundle_sha256 != expected_bundle_sha256:
              raise SystemExit(f"FULL_BUNDLE_SHA256_MISMATCH:{actual_bundle_sha256}")

          out = Path("/tmp/e004-aya-43-curriculum-and-scope-bundle-v1.json")
          out.write_bytes(bundle_bytes)
          print(f"RECONSTRUCTED_ENTRY_COUNT={len(entries)}")
          print(f"RECONSTRUCTED_BUNDLE_SHA256={actual_bundle_sha256}")
          print("PERSISTED_RAW_AYA_TEXT=ABSENT")
          print("PERSISTED_USER_ID=ABSENT")
          PY

          PYTHONPATH=. python3 scripts/e004_aya_43_curriculum_construction_v1.py validate \
            --bundle /tmp/e004-aya-43-curriculum-and-scope-bundle-v1.json

      - name: Verify implementation identity
        shell: bash
        run: |
          set -euo pipefail
          echo "IMPLEMENTATION_SHA256=$(sha256sum scripts/e004_aya_43_curriculum_construction_v1.py | awk '{print $1}')"
          echo "METHOD_SHA256=$(sha256sum specs/007-sft-v1/e004-aya-43-curriculum-construction-method-v1-2026-09-04.md | awk '{print $1}')"

      - name: Assert no raw Aya payload exists in checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train-00000-of-00001.parquet
          test ! -e aya-train.parquet

      - name: Verify diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
