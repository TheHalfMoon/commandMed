            8831e4f1a044471340f7c0a83d7bd71306a5b867e95fd870f74d0c5308a904d5
          download_and_verify "$QWEN_REPOSITORY" "$QWEN_REVISION" \
            vocab.json 2776833 \
            ca10d7e9fb3ed18575dd1e277a2579c16d108e32f27439684afa0e10b1440910
