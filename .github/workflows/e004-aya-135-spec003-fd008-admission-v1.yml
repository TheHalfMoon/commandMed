name: E004 Aya 135 Spec 003 FD008 admission V1

on:
  pull_request:
    paths:
      - "scripts/e004_aya_135_spec003_fd008_admission_v1.py"
      - "specs/007-sft-v1/e004-aya-135-deterministic-admission-projection-v1.json"
      - "specs/007-sft-v1/e004-registry-current-state-reconciliation-v22-2026-09-04.md"
      - ".github/workflows/e004-aya-135-spec003-fd008-admission-v1.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Bind exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "HEAD_SHA=$(git rev-parse HEAD)"

      - name: Verify canonical Spec 003 source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object src/commandmed/eval_contract/lineage.py)" = "5d7a5b6a8b48b2b5a7afea35ed18ceb1c9fe6425"
          test "$(git hash-object data/lineage/lineage_contract.json)" = "692de9b32271031b0f1dd9cc6edc98bc44b580b5"
          echo "SPEC003_EVALUATOR_LINEAGE_BLOB=5d7a5b6a8b48b2b5a7afea35ed18ceb1c9fe6425"
          echo "SPEC003_LINEAGE_CONTRACT_BLOB=692de9b32271031b0f1dd9cc6edc98bc44b580b5"

      - name: Verify deterministic projection identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum specs/007-sft-v1/e004-aya-135-deterministic-admission-projection-v1.json | awk '{print $1}')"
          test "${actual}" = "1c696862705e50f10b8621f425389f8f9db0122ef8cc3027e46d50d6835430e7"
          echo "DETERMINISTIC_PROJECTION_SHA256=${actual}"

      - name: Compile admission adapter
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/e004_aya_135_spec003_fd008_admission_v1.py

      - name: Execute canonical Spec 003 admission
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/e004-aya-135-spec003-post-fd008-admission-v1.json"
          PYTHONPATH=. python3 scripts/e004_aya_135_spec003_fd008_admission_v1.py \
            --projection specs/007-sft-v1/e004-aya-135-deterministic-admission-projection-v1.json \
            --contamination-evidence specs/007-sft-v1/e004-aya-135-qualification-evidence-v1.json \
            --contract data/lineage/lineage_contract.json \
            --out "${out}" \
            | tee "${RUNNER_TEMP}/admission-summary.json"
          python3 - "${RUNNER_TEMP}/admission-summary.json" <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["candidate_count"] == 135
          assert summary["validation_error_count"] == 0
          assert summary["state_counts"] == {"BLOCKED": 92, "ELIGIBLE": 43}
          assert summary["reason_counts"] == {"PRIVACY_UNRESOLVED": 17, "RIGHTS_UNRESOLVED": 92}
          assert summary["output_sha256"] == "a6b21bd273b43f0912fbc8a0732d981fd7ebe8622a1c9a87cb1218286805818a"
          PY
          rm -f "${out}" "${RUNNER_TEMP}/admission-summary.json"

      - name: Verify V22 result binding
        shell: bash
        run: |
          set -euo pipefail
          v22="specs/007-sft-v1/e004-registry-current-state-reconciliation-v22-2026-09-04.md"
          grep -Fxq 'SPEC003_POST_FD008_RESULTS_SHA256=a6b21bd273b43f0912fbc8a0732d981fd7ebe8622a1c9a87cb1218286805818a' "${v22}"
          grep -Fxq 'SPEC003_CANDIDATE_COUNT=135' "${v22}"
          grep -Fxq 'SPEC003_ELIGIBLE_COUNT=43' "${v22}"
          grep -Fxq 'SPEC003_BLOCKED_COUNT=92' "${v22}"
          grep -Fxq 'SPEC003_VALIDATION_ERROR_COUNT=0' "${v22}"
          grep -Fxq 'FINAL_CURRICULUM_ADMISSION_AUTHORITY=NONE' "${v22}"
          grep -Fxq 'DATASET_SNAPSHOT_AUTHORITY=NONE' "${v22}"
          grep -Fxq 'TRAINING_AUTHORITY=NONE' "${v22}"
          grep -Fxq 'PROJECT_FINISHED=NO' "${v22}"

      - name: Assert no raw Aya payload exists in checkout
        shell: bash
        run: |
          set -euo pipefail
          test ! -e data/train-00000-of-00001.parquet
          test ! -e aya-train.parquet

      - name: Verify diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
