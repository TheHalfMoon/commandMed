name: E004 Aya 135 exact replay transport V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/e004-aya-135-replay-transport-v2.yml

permissions:
  contents: read
  actions: write

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_REPOSITORY: CohereLabs/aya_dataset
      EXPECTED_REVISION: f9ea04583f02a8f86404ff6c58bf75fe637df8a2
      EXPECTED_FILE: data/train-00000-of-00001.parquet
      EXPECTED_SHA256: 51baa85043b569ba117f41516b32d1b0e4e2647fb203a08933f98a556fb1fb06
      EXPECTED_XET_HASH: 3a0e7a5f4bf474bb9877936ee28f8d866be5990c7d52e4f6e6ca68dbd3437082
      EXPECTED_SIZE_BYTES: "137195800"
      ARTIFACT_NAME: E004_AYA_EXACT_PAYLOAD_TRANSPORT_BRIDGE

    steps:
      - name: Verify bounded runner and exact public route metadata
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          set -euo pipefail

          test "${RUNNER_ENVIRONMENT}" = "github-hosted"
          test "${REPOSITORY_VISIBILITY}" = "public"

          source_repo_url="https://huggingface.co/datasets/${EXPECTED_REPOSITORY}"
          actual_head="$(git ls-remote "${source_repo_url}" refs/heads/main | awk '{print $1}')"
          test "${actual_head}" = "${EXPECTED_REVISION}"

          pointer_url="${source_repo_url}/raw/main/${EXPECTED_FILE}"
          pointer="$(curl --fail --silent --show-error --location --retry 3 "${pointer_url}")"
          printf '%s\n' "${pointer}" | grep -Fqx "oid sha256:${EXPECTED_SHA256}"
          printf '%s\n' "${pointer}" | grep -Fqx "size ${EXPECTED_SIZE_BYTES}"

          metadata_url="${source_repo_url}/blob/main/${EXPECTED_FILE}"
          metadata="$(curl --fail --silent --show-error --location --retry 3 "${metadata_url}")"
          printf '%s' "${metadata}" | grep -Fq "${EXPECTED_XET_HASH}"
          printf '%s' "${metadata}" | grep -Fq "${EXPECTED_SHA256}"

          resolve_url="${source_repo_url}/resolve/main/${EXPECTED_FILE}?download=true"
          headers_file="$(mktemp)"
          http_code="$(curl --silent --show-error --dump-header "${headers_file}" --output /dev/null --max-redirs 0 --write-out '%{http_code}' "${resolve_url}")"
          test "${http_code}" = "302" || test "${http_code}" = "307"
          ! grep -qi '^www-authenticate:' "${headers_file}"
          redirect_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^location:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "${headers_file}")"
          test -n "${redirect_location}"
          printf '%s' "${redirect_location}" | grep -Fq "${EXPECTED_XET_HASH}"
          rm -f "${headers_file}"

          echo "PRECHECK_RESULT=PASS"
          echo "PRECHECK_MAIN_HEAD_MATCH=PASS"
          echo "PRECHECK_XET_HASH_MATCH=PASS"
          echo "PRECHECK_PUBLISHED_SHA256_MATCH=PASS"
          echo "PRECHECK_PUBLIC_UNAUTHENTICATED_ROUTE=PASS"
          echo "PRECHECK_RUNNER_CLASS=STANDARD_GITHUB_HOSTED_PUBLIC_REPOSITORY_RUNNER"

      - name: Download exact bytes and verify remote SHA-256
        id: payload
        shell: bash
        run: |
          set -euo pipefail

          source_repo_url="https://huggingface.co/datasets/${EXPECTED_REPOSITORY}"
          resolve_url="${source_repo_url}/resolve/main/${EXPECTED_FILE}?download=true"
          payload_path="${RUNNER_TEMP}/aya-train.parquet"

          curl --fail --silent --show-error --location --retry 3 --retry-delay 2 --output "${payload_path}" "${resolve_url}"

          actual_size="$(stat -c '%s' "${payload_path}")"
          actual_sha256="$(sha256sum "${payload_path}" | awk '{print $1}')"

          if [ "${actual_size}" != "${EXPECTED_SIZE_BYTES}" ] || [ "${actual_sha256}" != "${EXPECTED_SHA256}" ]; then
            rm -f "${payload_path}"
            echo "REMOTE_BYTE_VERIFICATION=FAIL"
            exit 1
          fi

          echo "payload_path=${payload_path}" >> "${GITHUB_OUTPUT}"
          echo "REMOTE_BYTE_VERIFICATION=PASS"
          echo "REMOTE_SHA256=${actual_sha256}"
          echo "REMOTE_SIZE_BYTES=${actual_size}"

      - name: Publish exact verified payload transport artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: E004_AYA_EXACT_PAYLOAD_TRANSPORT_BRIDGE
          path: ${{ steps.payload.outputs.payload_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove runner payload
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/aya-train.parquet"
          echo "RUNNER_TRANSIENT_PAYLOAD_CLEANUP=COMPLETE"

# Bounded replay trigger for FD-008 deterministic record-evidence execution.
